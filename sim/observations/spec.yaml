# The exam: what people report about knots, as tests every theory sits (sim/PLAN.md §4).
#
# VERSIONED. Version 4, 27 Sep 2026. Each change is dated, with its reason, in `changes`, and every result names the version
# it used. Version 1 (26 Sep 2026) was frozen before any sweep, and versions 1-3 were also sealed by hash
# (observations/seal.yaml keeps that record); from 27 Sep 2026 the exam is versioned, not sealed, at the author's word:
# sealing is kept for predictions of a real experiment, before any data. An observation says what happens, never how.
#
# The record is the author's own account: the Observations chapter of the site's introduction (src/data/tour.ts), its
# chapters on the ladder and on age, and the author's messages (observations/author.md). The author asked that the wording
# rest on judgment, and that the introduction, not the essays, be the record: the essays' text was generated, and is
# sometimes off. Reports found only in the essays are listed under `set_aside`, unscored, until the author confirms them.
# The author's lines are quoted under `words`. Evidence: S, self-report; M, measured in the literature.

version: 4
status: versioned
sealed: 2026-09-27
updated: 2026-09-27

changes:  # each version's changes, newest first
  - version: 4
    date: 2026-09-27
    items:
      - "The author's answers are rough feelings, to be considered and not taken as definitive: 'Take all my answers as just rough feelings. Not definitive but to be considered.' Parts that rest on them are marked rough: scored and shown, and left out of the joint pass (every part at once). O8.2, a knot back in the same place, becomes rough."
      - "O17 (new, rough): a knot can be felt as a bump, from a grain to perhaps a penny across, beneath the skin rather than in it, and it goes as it lets go, like an unclenching. Two parts: a bump beneath the skin, and the bump going with the release as a contraction letting go. Each is read from the theory's own account of what a knot is, the same in every setting. 'Maybe less over bone' is noted with it, not scored."
      - "O18 (new, rough, not run): pressing or rolling can bring a knot out, over minutes. It needs a rolling trial in every theory."
      - "Q2 (open, not scored): how fast do knots form? The author: 'not sure'."
      - "Q4 (open, not scored): the hand or the attention it draws? The author thinks breath and attention alone may be enough, the hand helping to aim attention. The harness gains trials that take them apart (attention without a hand, a hand without attention), for every theory."
      - "Q3 (open, not scored): are knots ever felt where no muscle lies between skin and bone? It follows from 'maybe less over bone', and splits the views in muscle from the rest."
      - "A correction to the trials, found while building the seventh theory: slow breathing began at the bottom of an out-breath, a step from the breathing before it that let some knots go at once, before any out-breath. It now begins halfway up an in-breath, so the first out-breath starts 2 s in, and the hand that eases off does so halfway through it. Every theory's trials are rerun with it."
      - "A second correction to the trials, found the same way: in the cluster trials the hand lifted the moment the worked knot let go, and a knot back within 2 s (a flicker, not a release, by the exam's own rule) had been counted as let go. The hand now stays until the knot has been let go for 2 s under it, a minute at most, for every theory."
      - "A seventh theory sits the exam from this version: the motor switch (T7), motor units that latch on and are kept on by their own metabolites. Made after the exploratory studies of 27 Sep (sim/PLAN.md findings 17-19): O17's readings are the author's words, not any model's."
  - version: 3
    date: 2026-09-27
    items:
      - "O8: the author describes a knot coming back to the spot a released one left: 'a rearrangement underneath and a new knot appears in what seems like the same place', 'a feeling of migrating into the same or similar spot', the same perforator or one from elsewhere, they cannot tell. O8 is scored in two parts: a new knot nearby (as before) and a knot back in the same or a similar spot, with a reading that counts every way it could happen. Made after version 2's results, and after the tree model's queue was on the site: any match is found after the fact."
      - "It partly echoes a report set aside from the essays, 'released and then replaced, as if from a queue', now in the author's own words, without the paths to the skull; that report stays set aside."
      - "From here the exam is versioned rather than sealed, at the author's word (27 Sep 2026): each change dated with its reason, every result naming the version it used; sealing is kept for predictions of a real experiment. The observations and readings of version 3 are unchanged."
  - version: 2
    date: 2026-09-27
    items:
      - "O2: asked whether a pressed knot lets go under the hand or as the hand eases off, the author could not say: 'I never was that observant of exactly when it lets go so could be either.' A reading now takes either. The first matrix read O2 with the hand still pressing (the harness's reading, stricter than the words), and no theory passed it; that result stays on record. Made after version 1's results, at the author's word."
      - "An open question is added, not scored: does a pressed knot let go under the hand, or as it eases off? The theories split on it, and anyone pressing a knot can watch for it."
  - version: 1
    date: 2026-09-26
    from: "the draft of 26 Sep 2026"
    items:
      - "The introduction is the record: each observation takes its words, and the essays are no longer a source."
      - "O2 is the introduction's: pressure and focused attention release knots one place at a time, and pressed, with a slow out-breath, a knot often lets go within seconds. The draft's 'pressure, then release, lets go faster than calm alone' was the vessel model's trial, not a report."
      - "O2b (focus alone) is folded into O2, where the introduction puts attention: with pressure."
      - "O16 is added from the introduction: some knots come and go with breath and mood."
      - "O14 (clusters at the base of the skull; warmth from an old cluster) is set aside: it is only in the essays. Where knots gather is in O4."
      - "The readings of the words and the scoring rules are fixed here, so that no reading can be stretched to fit a model."

