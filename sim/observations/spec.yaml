  - {words: "a single relaxing breath", reads: "one slow breath with a long out-breath, with no pressure and no focus on a place"}
  - {words: "within seconds", reads: "within 10 s, during the out-breath"}
  - {words: "press into a knot, breathe out slowly", reads: "a hand that holds through the out-breath, or one that eases off halfway through it: either counts (v2)"}
  - {words: "a new knot appears in what seems like the same place", reads: "within 10 minutes of a knot letting go, a knot is held at its place: the same unit held again; a unit beneath it (a vessel's children, which a released parent can leave shut); or one of its immediate neighbours that was not held before (siblings on one feed, the adjacent units of a taut band, the eight places around it on a body map) (v3)"}
  - {words: "sometimes", reads: "where it happens in the trial: not required every time (v3)"}
  - {words: "the knots can def be felt; doesn't seem to pinch with the skin", reads: "the theory's knot is a physical change the hand could feel beneath the skin, a contraction or stiffening in muscle or fascia; not a change in what is felt alone, nor in blood flow alone (v4)"}
  - {words: "let go and disappear; a release feel like unclenching", reads: "at a release the knot's contraction lets go (a unit falls silent, a contracture relaxes), and the bump goes with it (v4)"}
  - {words: "rough feelings", reads: "a part resting on the author's answers is scored and shown, and left out of the joint pass (v4)"}
  - {words: "within a breath or two", reads: "by the end of the second breath"}
  - {words: "many breaths", reads: "from the third breath to the thirtieth"}
  - {words: "often", reads: "in at least half of the trials"}
  - {words: "many (knots, children)", reads: "at least three"}
  - {words: "at once", reads: "within the same breath"}
  - {words: "one place at a time", reads: "releases confined to the place pressed or attended"}
  - {words: "broad", reads: "releases spread across regions, not concentrated at one place"}
  - {words: "focused", reads: "most releases in one region, few elsewhere"}
  - {words: "from moment to moment", reads: "formed and let go within a breath"}
