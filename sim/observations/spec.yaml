# Reports that appear only in the essays, whose text was generated and is sometimes off. Not scored, until the author confirms.
set_aside:
  - "Releases run along paths that converge on the back of the skull, where knots are released and then replaced, as if from a queue."
  - "Knots cluster most at the base of the skull, and an old, heavily loaded cluster can let go with a wave of warmth spreading from the site."
  - "Distant places (the brow, the temple, the jaw, the side of the nose) can unlock a stubborn region at the ridge of the skull."
  - "Pressure alone does not seem to release a knot."
  - "Fresh knots yield in a session; old ones take months."
  - "The knots go first: the fascia's separating cannot begin at a site until its knots are gone."

# Questions the reports cannot answer yet, and that would tell the theories apart. Shown, not scored.
open:
  - id: Q1
    question: "Pressed, with a slow out-breath, does a knot let go under the hand, or as the hand eases off?"
    why: "The author was not watching for it (O2). The theories split: the harness reports when each lets a pressed knot go."
  - id: Q2
    question: "How fast do knots form: within seconds of a stressful moment, only after long tension or stillness, or days later?"
    why: "The theories part on it: a vessel's switch or a motor unit's latch within seconds, a trigger point's energy crisis over tens of minutes. The author, asked how fast knots grow under stress: 'I’m not sure on two.'"
  - id: Q3
    question: "Are knots ever felt where no muscle lies between the skin and the bone: the flat of the shin, the crown of the head, the back of the hand, the kneecap?"
    why: "The author: 'Maybe less over bone.' The views part on it: a knot in muscle (trigger points, the motor switch) cannot be there; a vessel at a fascial piercing, densified fascia, a nerve or a percept can. Anyone who feels for knots could notice."
  - id: Q4
    question: "Does the hand release a knot, or the breath and attention it draws? Does a knot let go to breath and attention alone, with no hand; and under a hand while attention is elsewhere?"
    why: "The author: 'we don’t know if the palpitation pressure vs complex meditative breath for release. I think breath plus attention alone may be enough but the pressure may help focus attention to area.' O2 has the two together. The views part on it: a press acts on the tissue itself in some (a vessel squeezed, a band lengthened), and only through attention in others."

# How the words are read when a trial is scored: fixed with the seal, so that no reading can be stretched to fit a model.
readings:
