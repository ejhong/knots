# Heat over the patch, as in a hot shower or a sauna (the scene "warmth"): what it does in each theory that has a route for it.
# Local heating dilates the skin's small vessels through a fast axon reflex and a slower nitric-oxide response, to most of
# their maximal flow, whatever the nerves do (minson2001); a hot shower warms the skin less than the 42 °C of that test.
# The latch's account lists heat among its releases; densification's layer thins with warmth (densification.yaml).
# Every number here is guessed and sampled. Added 28 Sep 2026. Same format as vessel.yaml.

model: warmth
title: Warmth
parameters:
  warm_tau:
    symbol: τ_heat
    label: "how fast the skin warms and its small vessels answer"
    value: 120.0
    unit: s
    range: [60.0, 300.0]
    confidence: guessed
    note: "Under local heating, skin flow reaches a first peak within minutes (the axon reflex) and a plateau later (nitric oxide), minson2001."

  warm_vessel:
    symbol: ΔA_heat
    label: "how much heat lowers the tone of a small artery beneath the skin and fat, as a share of maximal"
    value: 0.08
    unit: "1"
    range: [0.02, 0.2]
    confidence: guessed
    note: "Local heating to 42 °C dilates the skin's own small vessels to most of their maximum, whatever the nerves do (minson2001); a small artery beneath the fat is warmed less, and heating the whole body also withdraws the sympathetic tone over minutes. One number for every theory whose knot is vascular smooth muscle: the perforators' walls and the latch's clamp alike."

  warm_layer:
    symbol: ΔT_shower
    label: "how much a hot shower warms the gliding layer beneath the skin and fat"
    value: 1.5
    unit: °C
    range: [0.5, 3.0]
    confidence: guessed
