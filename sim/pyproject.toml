[project]
name = "knots-sim"
version = "0.1.0"
description = "The theories of knots as dynamical models, run against the reported observations; the results feed the site."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Eugene Jhong" }]
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "sympy>=1.13",
  "SALib>=1.5",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knots_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
